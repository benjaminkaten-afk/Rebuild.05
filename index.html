<style>
@font-face{font-family:'ArchivoLocal';src:local('Archivo');}
:root{
  --orange:#FB4F14; --orange-deep:#D63E0A; --black:#101010;
  --paper:#F5F5F7; --card:#FFF; --ink:#1C1C1E; --muted:#6E6E73; --faint:#AEAEB2;
  --hairline:rgba(0,0,0,.08);
  --sh:0 1px 2px rgba(16,16,16,.05),0 10px 30px rgba(16,16,16,.07);
  --sh-f:0 2px 6px rgba(16,16,16,.10),0 16px 40px rgba(16,16,16,.14);
  --r:18px;
  --disp:'Archivo','Archivo Black','Helvetica Neue',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);overscroll-behavior-y:none}
body{font-family:-apple-system,'Roboto',system-ui,sans-serif;color:var(--ink)}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper)}
button,select,input,a{font-family:inherit}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:6px}

/* hero */
.hero{position:relative;background:linear-gradient(160deg,#FF5E1F 0%,var(--orange) 45%,var(--orange-deep) 100%);overflow:hidden;padding:calc(22px + env(safe-area-inset-top)) 20px 22px}
.hero>svg{position:absolute;inset:-10px -10px auto -10px;height:130%;width:calc(100% + 20px);opacity:.9}
.hero-in{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;font-family:var(--disp);font-style:italic;font-weight:900;font-size:34px;line-height:1;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.phase{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;white-space:nowrap;backdrop-filter:blur(6px)}
.phase.deload{background:#101010;color:#FFC38F}
.hero-sub{margin:8px 0 16px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.92)}
.hero-actions{display:flex;align-items:center;gap:8px}
.today{border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;cursor:pointer;background:#fff;color:var(--orange-deep);box-shadow:0 3px 10px rgba(0,0,0,.22);transition:transform .1s}
.today:active{transform:scale(.95)}
.today.on{background:rgba(0,0,0,.45);color:#fff;box-shadow:none;cursor:default}

.pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border:none;border-radius:13px;background:rgba(0,0,0,.30);color:#fff;cursor:pointer;text-align:left;backdrop-filter:blur(4px);transition:background .15s}
.pick.open{background:rgba(0,0,0,.45)}
.pick-l b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:17px;letter-spacing:-.01em}
.pick-l i{display:block;font-style:normal;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}
.pick-r{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.9;white-space:nowrap}
.pick .chev{width:11px;height:7px;transition:transform .2s}
.pick.open .chev{transform:rotate(180deg)}
.picker{margin-top:10px;background:rgba(0,0,0,.52);border-radius:14px;padding:13px;backdrop-filter:blur(6px)}
.plab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:0 0 7px}
.picker .plab+.weeks{margin-bottom:14px}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.blk{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 10px;border:none;border-radius:12px;background:rgba(0,0,0,.30);color:rgba(255,255,255,.85);cursor:pointer;text-align:left;backdrop-filter:blur(4px);transition:transform .1s,background .15s,color .15s,box-shadow .15s}
.blk:active{transform:scale(.97)}
.blk b{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:-.01em}
.blk span{font-size:11px;font-weight:600;opacity:.85}
.blk i{font-size:10px;font-style:normal;opacity:.65;margin-top:2px}
.blk.on{background:#fff;color:var(--orange-deep);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.blk.on span,.blk.on i{color:var(--ink);opacity:.75}


.srow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slabel{width:72px;flex:none;color:#fff;line-height:1.1}
.slabel b{display:block;font-family:var(--disp);font-size:13px;font-weight:800}
.slabel span{font-size:10px;opacity:.7}
.scells{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;flex:1}
.scell{aspect-ratio:1;border:none;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.9);position:relative;transition:transform .1s}
.scell:active{transform:scale(.9)}
.scell.reintroduction{background:rgba(255,255,255,.18)}
.scell.accumulation{background:rgba(255,255,255,.32)}
.scell.deload{background:rgba(16,16,16,.75);color:#FFC38F}
.scell.past{opacity:.55}
.scell.hit::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#fff}
.scell.now{box-shadow:0 0 0 2px #fff}
.scell.sel{outline:2px solid #fff;outline-offset:-2px;background:#fff;color:var(--orange-deep)}
.skey{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:10.5px;color:rgba(255,255,255,.85);font-weight:600}
.skey .k{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.skey .k.reintroduction{background:rgba(255,255,255,.18)}
.skey .k.accumulation{background:rgba(255,255,255,.32)}
.skey .k.deload{background:rgba(16,16,16,.75)}
.skey .k.hit{background:#fff;border-radius:50%;width:6px;height:6px;margin:0 6px 0 2px}
.sstart{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.sstart label{font-size:11.5px;color:rgba(255,255,255,.85);font-weight:600}
.sstart input{flex:1;border:none;border-radius:8px;padding:7px 9px;font-size:13px;background:rgba(255,255,255,.92);color:var(--ink);font-weight:600}

.blockfocus{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.45}
.blockfocus b{color:var(--ink)}

.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.wk.dl:not(.on){background:rgba(16,16,16,.55);color:#FFC38F}
.wk{aspect-ratio:1;border-radius:12px;border:none;background:rgba(0,0,0,.30);color:rgba(255,255,255,.85);font-family:var(--disp);font-weight:700;font-size:16px;cursor:pointer;backdrop-filter:blur(4px);transition:transform .1s,background .15s,color .15s,box-shadow .15s}
.wk:active{transform:scale(.92)}
.wk.on{background:#fff;color:var(--orange-deep);box-shadow:0 4px 14px rgba(0,0,0,.28);font-weight:900}

/* daybar */
.daybar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:9px 8px;background:rgba(245,245,247,.86);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:.5px solid var(--hairline)}
.chip{min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px;border:none;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;position:relative;transition:background .15s,color .15s,box-shadow .15s}
.chip b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.05}
.chip i{font-size:9.5px;color:var(--muted);font-weight:600;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.on{background:var(--black);color:#fff;box-shadow:0 3px 10px rgba(16,16,16,.22)}
.chip.on i{color:var(--orange)}
.chip.istoday:not(.on)::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--orange)}

.content{padding:20px 16px calc(34px + env(safe-area-inset-bottom))}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}
.dayname{margin:0;font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;line-height:.95;letter-spacing:-.02em}
.daytag{margin:6px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
.prog{text-align:right;min-width:92px}
.prog b{font-family:var(--disp);font-weight:800;font-size:25px;line-height:1}
.prog span{color:var(--faint);font-weight:500}
.track{height:5px;background:rgba(0,0,0,.08);border-radius:999px;margin-top:7px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--orange),#FF7A3D);border-radius:999px;transition:width .3s cubic-bezier(.2,.8,.2,1)}

// Block 1 seeds at base. Blocks 2 and 3 seed +1 set on primary movers (grow >= 2) only,
// so sessions stay inside 90 minutes.
const setsFor = (ex, w, b) => {
  const seed = ex.base + (b > 0 && ex.grow >= 2 ? 1 : 0);
  if (w<=2) return seed;
  if (w===8) return Math.max(1, Math.round(seed/2) + (seed>=3?1:0));
  return seed + Math.round((ex.grow||0)*((w-2)/5));
};

/* ---------- persistence ---------- */
const DB = {

  set(k, v){ try { localStorage.setItem("rb:"+k, JSON.stringify(v)); } catch(e){ console.warn("save failed", e); } },
  has(k){ try { return localStorage.getItem("rb:"+k) !== null; } catch { return false; } },

};
const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (dt, n) => { const d = new Date(dt); d.setDate(d.getDate()+n); return d; };
const fmtDate = d => d.toLocaleDateString(undefined, {month:"short", day:"numeric"});

/* ---------- extra-time bonus exercises ----------
   Each lifting day carries two hidden bonus exercises aimed at the day's
   least-worked target group. Available every lifting day except deload. The choice
   lives in the session log so it can differ week to week.
     +10 → bonus 1 × 3 sets
     +15 → bonus 1 × 3 sets + bonus 2 × 2 sets
     +20 → bonus 1 × 3 sets + bonus 2 × 3 sets */
const EXTRA_SETS_EARLY = { 10:[3], 15:[3,2], 20:[3,3] };   // weeks 1–4: base volume has room
const EXTRA_SETS_LATE  = { 10:[2], 15:[2,2], 20:[3,2] };   // weeks 5–7: base is near ceiling

const bonusAllowed = (day) => !!day.bonus && !day.wallOnly && S.week<=7;
const activeBonus = (day) => {
  if (!bonusAllowed(day)) return [];
  const plan = extraSets()[S.log.extra] || [];
  return plan.map((n,i)=>({ ex: day.bonus[i], key: "x"+i, n }));
};
/* Resolve a log key ("2" → exercises[2], "x0" → bonus[0]) to its exercise. */
const exFor = (day,key) => String(key).startsWith("x") ? day.bonus[+String(key).slice(1)] : day.exercises[+key];
const persistPos = () => { DB.set("block",S.block); DB.set("week",S.week); DB.set("day",S.day); };

function todayPosition(){
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((now - parseDate(S.start)) / 86400000);
  if (diff < 0) return { block:0, week:1, day:0, before:true };
  const gw = Math.min(TOTAL_WEEKS-1, Math.floor(diff/7));
  const dow = now.getDay();
  const day = dow===0 || dow===6 ? 5 : dow-1;
  return { block: Math.floor(gw/WEEKS_PER_BLOCK), week: (gw%WEEKS_PER_BLOCK)+1, day, after: diff >= TOTAL_WEEKS*7 };
}

}

/* ---------- wall sit timer ---------- */
const HOLD=120, REST=120, ROUNDS=4, RADIUS=64, CIRC=2*Math.PI*RADIUS;
const T = { mode:"idle", round:0, left:HOLD, iv:null };
function tick(){
  T.left--;
  if (T.left > 0) { paintTimer(); return; }
  if (T.mode === "hold") {
    const w = S.log.wall || (S.log.wall = []);
    w[T.round] = true; saveLog();
    if (T.round + 1 >= ROUNDS) stopTimer("complete");
    else { T.mode = "rest"; T.left = REST; }
  } else if (T.mode === "rest") { T.round++; T.mode = "hold"; T.left = HOLD; }
  buzz(); render();
}
function startTimer(){ T.round=0; T.mode="hold"; T.left=HOLD; clearInterval(T.iv); T.iv=setInterval(tick,1000); keepAwake(true); render(); }
function stopTimer(mode){ clearInterval(T.iv); T.iv=null; T.mode = mode || "idle"; T.left=HOLD; if(!mode) T.round=0; keepAwake(false); }
function buzz(){ try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch {} }
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch {}
}
function paintTimer(){
  const c = document.getElementById("clock"), r = document.getElementById("rf");
  if (!c || !r) return;
  c.textContent = fmt(T.left);
  r.setAttribute("stroke-dashoffset", CIRC * (T.left/(T.mode==="hold"?HOLD:REST)));
}
const fmt = s => `${Math.floor(s/60)}:${String(Math.max(0,s%60)).padStart(2,"0")}`;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const demoUrl = term => "https://www.youtube.com/results?search_query=" + encodeURIComponent(`${term} form technique ${COACHES.find(c=>c.id===S.coach).scope}`);
function weekHasWork(b, w){
  for (let d=0; d<6; d++) {
    const l = DB.get(logKey(b,w,d), null);
    if (!l) continue;
    if (l.wall && l.wall.some(Boolean)) return true;
    for (const k in l) {
      const e = l[k];
      if (k==="wall" || !e || typeof e !== "object") continue;
      if (e.done?.some(Boolean)) return true;
      if (e.reps?.some(r => Number.isFinite(r) && r > 0)) return true;
    }
  }
  return false;
}

/* ---------- set logging model ----------
   A set is logged by typing the reps you actually did. Entries look like
   { reps:[10,10,9], weight:"85", name:"Lat pulldown" }.
   Sessions logged before rep entry existed carry { done:[true,...] } instead;
   those still count as complete, they just have no rep numbers to compare. */
const repOf   = (e,s) => { const v = e && e.reps && e.reps[s]; return Number.isFinite(v) && v > 0 ? v : null; };
const setDone = (e,s) => !!(repOf(e,s) || (e && e.done && e.done[s]));
const doneCount = (e,n) => { let c=0; for (let s=0;s<n;s++) if (setDone(e,s)) c++; return c; };

/* Top of a prescribed rep range: "8–10" → 10, "15" → 15, "12/side" → 12,
   "to failure" → null (nothing to max out against). */
const topOfRange = str => {
  const nums = String(str).match(/\d+/g);
  return nums ? Math.max(...nums.map(Number)) : null;
};

/* Most recent logged session per exercise name, looking back through every
   earlier session (earlier days this week, earlier weeks, earlier blocks).
   Entries carry the exercise name from the day they were saved, so exercise
   swaps between weeks never cross-match; older name-less entries fall back to
   slot index. Read-only — never written back. */
const lastSessions = () => {
  const cur = S.block*100 + S.week*10 + S.day, out = {};
  for (let b=S.block; b>=0; b--) {
    const days = BLOCKS[b].days;
    for (let w=WEEKS_PER_BLOCK; w>=1; w--) {
      for (let d=days.length-1; d>=0; d--) {
        if (b*100 + w*10 + d >= cur) continue;
        const l = DB.get(logKey(b,w,d), null); if (!l) continue;
        const take = (e, fallback) => {
          if (!e) return;
          const wt = e.weight===undefined || e.weight===null ? "" : String(e.weight).trim();
          const reps = (e.reps||[]).filter(r => Number.isFinite(r) && r > 0);
          if (!wt && !reps.length) return;
          const name = canon(e.name || fallback);
          if (out[name]) return;
          out[name] = { weight: wt, reps, b, w, d };
        };
        days[d].exercises.forEach((ex,i)=>take(l[i], ex.name));
        (days[d].bonus||[]).forEach((ex,i)=>take(l["x"+i], ex.name));
      }
    }
  }
  return out;
};

/* "You maxed the range last time" flag. Needs at least two logged sets, every
   one of them at or above the top of the prescribed range. */
const maxedLast = (ex, ls) => {
  const top = topOfRange(ex.reps);
  if (!top || !ls || !ls.reps || ls.reps.length < 2) return null;
  return ls.reps.every(r => r >= top) ? { top, sets: ls.reps.length, weight: ls.weight } : null;
};

/* Which card is expanded. One at a time keeps the day short on a phone. */
function autoOpen(){
  const day = BLOCKS[S.block].days[S.day];
  if (day.wallOnly) { S.open = null; return; }
  const items = dayItems(day);
  const next = items.find(o => doneCount(S.log[o.key], o.n) < o.n);
  S.open = next ? next.key : null;
}
const dayItems = (day) =>
  day.exercises.map((ex,i)=>({ ex, key:String(i), n:setsFor(ex,S.week,S.block), isBonus:false }))
    .concat(activeBonus(day).map(b=>({ ex:b.ex, key:b.key, n:b.n, isBonus:true })));

/* ---------- render ---------- */
const CHEV = `<svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function render(){
  const keepY = window.scrollY;
  const B = BLOCKS[S.block];
  const day = B.days[S.day];
  const phase = phaseFor(S.week);
  const items = dayItems(day);
  const total = items.reduce((a,o)=>a+o.n,0);
  const done  = items.reduce((a,o)=>a+doneCount(S.log[o.key],o.n),0);
  const pct = total ? done/total : 0;
  const gw = globalWeek();
  const ws = weekStart(S.start, gw);
  const tp = todayPosition();
  const isToday = tp.block===S.block && tp.week===S.week && tp.day===S.day;

  let html = `
  <header class="hero">${STRIPES}<div class="hero-in">
    <div class="hero-top">
      <h1 class="brand">REBUILD</h1>
      <div class="hero-actions">
        ${phase==="Deload"?`<span class="phase deload">Deload</span>`:""}
        <button class="today ${isToday?"on":""}" id="today">${isToday?"Today":"Go to today"}</button>
      </div>
    </div>
    <p class="hero-sub">Week ${gw+1} of ${TOTAL_WEEKS} · ${fmtDate(ws)} – ${fmtDate(addDays(ws,6))} · RIR ${RIR[S.week]}${S.week===8?" · load −10%":""}</p>
    <button class="pick ${S.pick?"open":""}" id="picktoggle" aria-expanded="${S.pick}">
      <span class="pick-l"><b>Week ${S.week} of 8</b><i>${esc(B.short)} · ${esc(B.name)}</i></span>
      <span class="pick-r">${S.pick?"Done":"Change week"} ${CHEV}</span>
    </button>
    ${S.pick ? pickerHtml(tp) : ""}
  </div></header>

  <nav class="daybar" aria-label="Training day">
    ${B.days.map((d,i)=>`<button class="chip ${i===S.day?"on":""} ${tp.day===i&&tp.week===S.week&&tp.block===S.block?"istoday":""}" data-day="${i}" aria-pressed="${i===S.day}"><b>${esc(d.sub==="Sat–Sun"?"Wknd":d.sub)}</b><i>${esc(d.wallOnly?"Cardio":d.name)}</i></button>`).join("")}
  </nav>

  <div class="content">
    <div class="dayhead">
      <div>
        <h2 class="dayname">${day.wallOnly?"Weekend":esc(day.name)}</h2>
        <p class="daytag">${esc(day.tag)}</p>
      </div>
      ${day.wallOnly?"":`<div class="prog"><b>${done}<span>/${total}</span></b><div class="track"><div class="fill" style="width:${pct*100}%"></div></div></div>`}
    </div>`;

  if (tp.before && isToday) html += `<div class="notice">Season starts ${fmtDate(parseDate(S.start))}. Change the start date under Change week.</div>`;
  if (S.week>=B.techWeek && S.week<=7 && !day.wallOnly)
    html += `<div class="notice">Technique unlocked — ${S.block===2?"one drop set or rest-pause on each isolation exercise":"one drop set on your final isolation exercise"}.</div>`;
  if (S.week===8 && !day.wallOnly)
    html += `<div class="notice dl">Deload week. Half volume, easy effort, load −10%.${S.block<2?" Next block seeds one set higher.":" Season ends — retest lifts, then plan the next run."}</div>`;

  const last = lastSessions();

  const exCard = (o) => {
    const { ex, key, n, isBonus } = o;
    const e = S.log[key] || {};
    const c = doneCount(e, n);
    const complete = c >= n;
    const open = S.open === key;
    const ls = last[canon(ex.name)];
    const maxed = maxedLast(ex, ls);
    const perArm = isPerArm(ex.name);

    let body = "";
    if (open) {
      const lastLine = ls
        ? `Last time${ls.weight?` · ${esc(ls.weight)} lb${perArm?"/arm":""}`:""}${ls.reps.length?` · ${ls.reps.join(" · ")} reps`:""} · wk ${ls.w}${ls.b!==S.block?` B${ls.b+1}`:""}`
        : "No history yet for this exercise.";
      body = `<div class="exbody">
        <div class="exrow">
          <div class="wt"><input inputmode="decimal" placeholder="—" data-wt="${esc(key)}" value="${esc(e.weight||"")}" aria-label="Weight for ${esc(ex.name)}${perArm?", per arm":""}">${
            ASK_ARM.has(ex.name)
              ? `<button class="unit tog" data-arm="${esc(ex.name)}" title="Tap to switch between one total load and one load per arm">${perArm?"lb per arm":"lb"}</button>`
              : `<span class="unit">${perArm?"lb per arm":"lb"}</span>`
          }</div>
          <a class="watch" href="${demoUrl(ex.demo)}" target="_blank" rel="noopener">Watch form</a>
        </div>
        <p class="exhist ${maxed?"hit":""}">${maxed
          ? `Maxed the range last time — ${maxed.sets} sets at ${maxed.top} reps${maxed.weight?` with ${esc(maxed.weight)} lb`:""}. Go up in weight and start back at the bottom.`
          : esc(lastLine)}</p>
        <div class="reps" role="group" aria-label="Reps per set for ${esc(ex.name)}">
          ${Array.from({length:n},(_,s)=>{
            const v = repOf(e,s);
            const legacy = !v && e.done && e.done[s];
            const hint = ls && ls.reps[s] ? String(ls.reps[s]) : "–";
            return `<label class="rep ${v||legacy?"on":""}"><span>${s+1}</span>
              <input inputmode="numeric" pattern="[0-9]*" maxlength="3" data-rep="${esc(key)}:${s}"
                value="${v||""}" placeholder="${legacy?"✓":esc(hint)}" aria-label="Set ${s+1} reps"></label>`;
          }).join("")}
        </div>
        <p class="exnote">Target ${esc(ex.reps)} reps · rest ${esc(ex.rest)}${ex.note?` · ${esc(ex.note)}`:""}</p>
      </div>`;
    }

    return `<article class="card ex ${complete?"done":""} ${isBonus?"bonus":""} ${open?"open":""}">
      <button class="exhead" data-toggle="${esc(key)}" aria-expanded="${open}">
        <span class="exlead">
          <span class="exname">${isBonus?`<span class="badge">Bonus</span>`:""}${esc(ex.name)}</span>
          <span class="exsub">${n} × ${esc(ex.reps)}</span>
        </span>
        <span class="extail">
          ${maxed && !complete ? `<span class="flag">Go heavier</span>` : ""}
          <span class="cnt ${complete?"full":""}">${complete?"✓":`${c}/${n}`}</span>
          ${CHEV}
        </span>
      </button>
      ${body}
    </article>`;
  };

  items.filter(o=>!o.isBonus).forEach(o=>{ html += exCard(o); });

  if (bonusAllowed(day)) {
    const cur = S.log.extra || 0;
    html += `<div class="extra">
      <div class="extra-t">Extra time today?${S.week>=5?`<div class="extra-s">Base volume is near ceiling this week — bonus sets drop to 2</div>`:""}</div>
      <div class="extra-b" role="group" aria-label="Add extra time">${[10,15,20].map(m=>`<button class="xb ${cur===m?"on":""}" data-extra="${m}" aria-pressed="${cur===m}">+${m}</button>`).join("")}</div>
    </div>`;
    items.filter(o=>o.isBonus).forEach(o=>{ html += exCard(o); });
  }

  if (day.wallSit) {
    const w = S.log.wall || [];
    const running = T.mode==="hold" || T.mode==="rest";
    const tot = T.mode==="hold"?HOLD:REST;
    html += `<section class="ws">${STRIPES}<div class="ws-in">
      <div class="ws-head">
        <div><h3 class="ws-title">Wall sit</h3><p class="ws-meta">4 × 2:00 hold · 2:00 rest · breathe normally</p></div>
        ${running ? `<button class="btn btn-d" id="wsstop">Stop</button>` : `<button class="btn btn-o" id="wsstart">${T.mode==="complete"?"Run again":"Start"}</button>`}
      </div>
      ${running?`<div class="ringwrap">
        <svg width="156" height="156" viewBox="0 0 156 156" aria-hidden="true">
          <circle cx="78" cy="78" r="${RADIUS}" class="rt"></circle>
          <circle cx="78" cy="78" r="${RADIUS}" class="rf ${T.mode==="rest"?"rest":""}" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(T.left/tot)}" id="rf"></circle>
        </svg>
        <div class="ringctr"><div class="clock" id="clock">${fmt(T.left)}</div><div class="ph">${T.mode==="hold"?`Hold ${T.round+1} of ${ROUNDS}`:"Rest"}</div></div>
      </div>`:""}
      ${T.mode==="complete"?`<p class="ws-done">All four holds finished.</p>`:""}
      <div class="pips ctr dk">${Array.from({length:ROUNDS},(_,i)=>`<button class="pip ${w[i]?"on":""}" data-wall="${i}" aria-pressed="${!!w[i]}">${i+1}</button>`).join("")}</div>
      <p class="ws-cue">Same knee angle every session. The fourth hold should be barely finishable.</p>
    </div></section>`;
  }

  if (day.cardio) html += cardioHtml(day.cardio);
  if (day.wallOnly) html += bpHtml();

  html += `<div class="coachrow"><label for="coach">Form demo channel</label>
    <select id="coach">${COACHES.map(c=>`<option value="${c.id}" ${c.id===S.coach?"selected":""}>${esc(c.label)}</option>`).join("")}</select></div>`;

  html += `<footer class="foot">
    <p>${esc(B.short)} · ${esc(B.name)} — ${esc(B.focus)}</p>
    <p>Wall sits Mon · Wed · Fri · Zone 2 Sat + Sun · Legs Tuesday, nothing heavy the day before.</p>
    <p>165–185 g protein · maintenance calories · creatine 3–5 g · sleep 7–9 h</p>
  </footer></div>`;

  document.getElementById("app").innerHTML = html;
  wire();
  window.scrollTo(0, keepY);
  viewportCheck();
}

function pickerHtml(tp){
  const nowGw = tp.before ? -1 : tp.block*WEEKS_PER_BLOCK + tp.week - 1;
  const rows = BLOCKS.map((b,bi)=>`
    <div class="srow">
      <div class="slabel"><b>${esc(b.short)}</b><span>${esc(b.name)}</span></div>
      <div class="scells">${[1,2,3,4,5,6,7,8].map(w=>{
        const gw = bi*WEEKS_PER_BLOCK + w - 1;
        return `<button class="scell ${phaseFor(w).toLowerCase()} ${weekHasWork(bi,w)?"hit":""} ${gw===nowGw?"now":""} ${gw<nowGw?"past":""} ${bi===S.block&&w===S.week?"sel":""}"
          data-jump="${bi}:${w}" title="Week ${gw+1} · ${fmtDate(weekStart(S.start,gw))}"><span>${gw+1}</span></button>`;
      }).join("")}</div>
    </div>`).join("");
  return `<div class="picker">
    <div class="plab">Week in ${esc(BLOCKS[S.block].short)}</div>
    <div class="weeks" role="group" aria-label="Select week in block">
      ${[1,2,3,4,5,6,7,8].map(w=>`<button class="wk ${w===S.week?"on":""} ${w===8?"dl":""}" data-wk="${w}" aria-pressed="${w===S.week}">${w}</button>`).join("")}
    </div>
    <div class="plab">Whole season — tap any week</div>
    ${rows}
    <div class="skey"><span><i class="k reintroduction"></i>Reintro</span><span><i class="k accumulation"></i>Build</span><span><i class="k deload"></i>Deload</span><span><i class="k hit"></i>Logged</span></div>
    <div class="sstart"><label for="startdate">Season start</label><input type="date" id="startdate" value="${S.start}"></div>
  </div>`;
}

function cardioHtml(c){
  const done = S.log.cardio || [];
  return `<section class="card cardio">
    <h3 class="sect-t">Zone 2 cardio</h3>
    <p class="sect-s">${c.sessions} sessions this weekend · ${c.min} min each · conversational pace, nose breathing.</p>
    <p class="exmeta"><strong>Incline walk, bike, rower, or easy jog</strong> · effort 5–6 of 10 · you should be able to hold a sentence</p>
    <div class="pips ctr">${Array.from({length:c.sessions},(_,i)=>`<button class="pip ${done[i]?"on":""}" data-cardio="${i}" aria-pressed="${!!done[i]}">${i+1}</button>`).join("")}</div>
    <p class="sect-s" style="margin:14px 0 0;text-align:center">Weekend placement keeps this clear of every lifting day, so it costs you nothing in recovery.</p>
  </section>`;
}

function bpHtml(){
  const r = S.bp.slice(-14);
  const hi = Math.max(160, ...r.map(e=>e.s)), lo = Math.min(60, ...r.map(e=>e.y));
  const px = i => r.length>1 ? (i/(r.length-1))*288+6 : 150;
  const py = v => 84 - ((v-lo)/(hi-lo))*72;
  let chart = "";
  if (r.length>1){
    chart = `<svg viewBox="0 0 300 92" class="bpchart" role="img" aria-label="Blood pressure trend">
      ${[120,140].map(g=>`<line x1="6" x2="294" y1="${py(g)}" y2="${py(g)}" class="grid"/>`).join("")}
      <polyline class="ln sys" points="${r.map((e,i)=>`${px(i)},${py(e.s)}`).join(" ")}"/>
      <polyline class="ln dia" points="${r.map((e,i)=>`${px(i)},${py(e.y)}`).join(" ")}"/>
      ${r.map((e,i)=>`<circle cx="${px(i)}" cy="${py(e.s)}" r="3.2" class="sys"/><circle cx="${px(i)}" cy="${py(e.y)}" r="3.2" class="dia"/>`).join("")}
    </svg>
    <div class="legend"><span><i style="background:var(--orange)"></i>Systolic</span><span><i style="background:var(--black)"></i>Diastolic</span><span class="g">Guides at 120 / 140</span></div>`;
  }
  const list = r.length ? `<ul class="bplist">${r.slice().reverse().slice(0,5).map(e=>
    `<li class="bprow"><span class="d">${e.d}</span><span class="v">${e.s}/${e.y}</span><button class="x" data-bpdel="${S.bp.indexOf(e)}">Remove</button></li>`).join("")}</ul>` : "";
  return `<section class="card">
    <h3 class="sect-t">Blood pressure</h3>
    <p class="sect-s">Seated, same time of day, three mornings a week.</p>
    <div class="bpin">
      <input class="bpn" id="sys" inputmode="numeric" placeholder="120" aria-label="Systolic">
      <span class="sl">/</span>
      <input class="bpn" id="dia" inputmode="numeric" placeholder="80" aria-label="Diastolic">
      <button class="btn btn-o grow" id="bpadd">Log reading</button>
    </div>${chart}${list}</section>`;
}

/* ---------- events ---------- */
const go = (b,w,d) => {
  S.block=b; S.week=w; S.day=d; S.pick=false;
  persistPos(); stopTimer(); loadLog(); autoOpen(); render();
};

/* Commit one rep box. Empty clears the set. Commits on Enter or on blur, never
   on every keystroke, so the field keeps focus while you type. */
function commitRep(inp){
  const [key, sRaw] = inp.dataset.rep.split(":");
  const s = +sRaw;
  const day = BLOCKS[S.block].days[S.day];
  const raw = inp.value.replace(/[^0-9]/g,"");
  const v = raw === "" ? null : Math.min(999, parseInt(raw,10));
  const e = S.log[key] || (S.log[key] = {});
  e.name = exFor(day,key).name;
  e.reps = e.reps || [];
  e.reps[s] = (v && v > 0) ? v : null;
  if (e.done) e.done[s] = false;          // a typed value supersedes a legacy tick
  saveLog();
}

/* Update just the bits a logged set changes: that box, its card's counter, and
   the day total. Re-rendering here would destroy the box you are tapping into
   next and swallow the tap, so the DOM is patched in place instead. */
function patchSet(inp){
  const [key, sRaw] = inp.dataset.rep.split(":");
  const s = +sRaw;
  const items = dayItems(BLOCKS[S.block].days[S.day]);
  const o = items.find(x => x.key === key);
  if (!o) return;
  const e = S.log[key] || {};
  const lab = inp.closest(".rep");
  if (lab) lab.classList.toggle("on", setDone(e, s));
  const card = inp.closest(".ex");
  if (card) {
    const c = doneCount(e, o.n), full = c >= o.n;
    card.classList.toggle("done", full);
    const cnt = card.querySelector(".cnt");
    if (cnt) { cnt.textContent = full ? "\u2713" : `${c}/${o.n}`; cnt.classList.toggle("full", full); }
    const flag = card.querySelector(".flag");
    if (flag && full) flag.remove();
  }
  const total = items.reduce((a,x)=>a+x.n,0);
  const done  = items.reduce((a,x)=>a+doneCount(S.log[x.key],x.n),0);
  const pb = document.querySelector(".prog b");
  if (pb) pb.innerHTML = `${done}<span>/${total}</span>`;
  const fill = document.querySelector(".fill");
  if (fill) fill.style.width = (total ? done/total*100 : 0) + "%";
}

function wire(){
  const day = BLOCKS[S.block].days[S.day];
  const byId = id => document.getElementById(id);

  byId("today").onclick = jumpToday;
  byId("picktoggle").onclick = () => { S.pick = !S.pick; render(); };

  const sd = byId("startdate");
  if (sd) sd.onchange = () => { if (sd.value) { S.start = sd.value; DB.set("start", S.start); render(); } };

  // Landing day when you change week or block: today's weekday if that is the
  // current calendar week, otherwise Monday. Never carries over the day you were on.
  const landDay = (b,w) => { const p = todayPosition(); return (p.block===b && p.week===w && !p.before && !p.after) ? p.day : 0; };
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{ const w=+b.dataset.wk; go(S.block, w, landDay(S.block,w)); });
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ const [bl,w]=b.dataset.jump.split(":").map(Number); go(bl,w,landDay(bl,w)); });
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>go(S.block, S.week, +b.dataset.day));

  document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    const k = b.dataset.toggle;
    S.open = (S.open === k) ? null : k;
    render();
    if (S.open === k) {
      const el = document.querySelector(`[data-toggle="${CSS.escape(k)}"]`);
      if (el) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight - 80) el.scrollIntoView({block:"center"}); }
    }
  });

  document.querySelectorAll("[data-extra]").forEach(b=>b.onclick=()=>{
    const m = +b.dataset.extra;
    S.log.extra = (S.log.extra===m) ? 0 : m; saveLog(); render();
  });

  document.querySelectorAll("[data-rep]").forEach(inp=>{
    inp.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); inp.blur(); } };
    inp.onblur = () => { commitRep(inp); patchSet(inp); };
  });

  document.querySelectorAll("[data-arm]").forEach(b=>b.onclick=()=>{
    const k = b.dataset.arm;
    S.arm[k] = !S.arm[k]; DB.set("arm", S.arm); render();
  });

  document.querySelectorAll("[data-wt]").forEach(inp=>inp.oninput=()=>{
    const k = inp.dataset.wt;
    const e = S.log[k] || (S.log[k] = {});
    e.name = exFor(day,k).name;
    e.weight = inp.value; saveLog();
  });

  document.querySelectorAll("[data-cardio]").forEach(b=>b.onclick=()=>{
    S.log.cardio = S.log.cardio || []; S.log.cardio[+b.dataset.cardio] = !S.log.cardio[+b.dataset.cardio];
    saveLog(); render();
  });
  document.querySelectorAll("[data-wall]").forEach(b=>b.onclick=()=>{
    S.log.wall = S.log.wall || []; S.log.wall[+b.dataset.wall] = !S.log.wall[+b.dataset.wall];
    saveLog(); render();
  });

  const c = byId("coach");
  if (c) c.onchange = () => { S.coach = c.value; DB.set("coach", S.coach); render(); };
  const st = byId("wsstart"); if (st) st.onclick = startTimer;
  const sp = byId("wsstop");  if (sp) sp.onclick = () => { stopTimer(); render(); };
  const add = byId("bpadd");
  if (add) add.onclick = () => {
    const s = +byId("sys").value, y = +byId("dia").value;
    if (!s || !y) return;
    S.bp.push({ d:localISO(new Date()), s, y }); DB.set("bp", S.bp); render();
  };
  document.querySelectorAll("[data-bpdel]").forEach(b=>b.onclick=()=>{ S.bp.splice(+b.dataset.bpdel,1); DB.set("bp",S.bp); render(); });
}

/* ---------- viewport guard ----------
   The page declares width=device-width, so it should never be scaled down. If the
   browser is rendering it far wider than the physical screen, the browser is in
   desktop-site mode, which ignores that declaration and zooms the whole page out. */
function viewportCheck(){
  const el = document.getElementById("vpwarn");
  if (!el) return;
  const w = document.documentElement.clientWidth;
  const sw = (window.screen && window.screen.width) || w;
  const desktopMode = w > 700 && w > sw * 1.3;
  el.textContent = desktopMode
    ? `This page is being laid out ${Math.round(w)}px wide on a ${Math.round(sw)}px screen, so your browser is shrinking it. Turn off "Desktop site" for this address in the browser menu.`
    : "";
  el.classList.toggle("show", desktopMode);
  document.body.classList.toggle("wide", desktopMode);
}
window.addEventListener("resize", () => { try { viewportCheck(); } catch {} });

/* ---------- install prompt ---------- */
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; document.getElementById("installbar").classList.add("show"); });
document.getElementById("installbtn").onclick = async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null;
  document.getElementById("installbar").classList.remove("show");
};
window.addEventListener("appinstalled", () => document.getElementById("installbar").classList.remove("show"));
/* offline caching turns itself on if sw.js is uploaded next to this file */
if ("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });

autoOpen();
render();

</script>
